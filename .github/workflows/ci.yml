name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  python:
    name: Lint, test, smoke-train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-groups
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests (synthetic data - no Kaggle needed)
        run: uv run pytest -q
      - name: End-to-end smoke run (data -> validation -> train)
        run: |
          uv run python -m routeguard.synthetic --out data/raw --n 4000
          uv run python -m routeguard.build_data
          uv run python -m routeguard.validate
          uv run python -m routeguard.train --n-trials 3 --no-mlflow
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-model-report
          path: reports/

  dashboard:
    name: Build dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build

  docker:
    name: Build and push images
    needs: [python, dashboard]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/routeguard-api:latest
            ${{ secrets.DOCKER_USERNAME }}/routeguard-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: ./dashboard
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/routeguard-dashboard:latest
            ${{ secrets.DOCKER_USERNAME }}/routeguard-dashboard:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
